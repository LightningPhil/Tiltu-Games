<!doctype html><html lang="en"><meta charset="utf-8"><title>Grid Club hover stability checks</title>
<style>body{margin:18px;font:14px system-ui;background:#101a27;color:#eaf8fa}button,select,input{font:inherit;padding:8px;margin:4px}iframe{display:block;border:1px solid #567;margin-top:14px;max-width:100%;height:720px;background:#101a27}pre{white-space:pre-wrap}label{display:inline-block}a{color:#72edee}</style>
<h1>Hover and board stability</h1><p>Isolated port 5193 only. These checks use practice data, exercise pointer handlers and mirror the app’s CSS hover rules onto test targets. The document and board geometry must stay fixed. This page is excluded from the offline build.</p>
<button id="reset">Load hover practice positions</button><label>Frame width <input id="width" type="number" value="1240" min="280" max="1500"></label><button id="resize">Apply width</button>
<label>Game <select id="game"></select></label><button id="open">Open game</button><button id="single">Check this game</button><button id="batch">Check next 8 games</button><button id="all">Check all 48 games</button><button id="followup">Check catalogue and pending turns</button><button id="draughts">Check draughts selection and capture</button><button id="clear">Clear report</button>
<pre id="report" role="status">Ready.</pre><iframe id="app-frame" title="Grid Club practice"></iframe>
<script type="module">
import {freshState,saveState,GAMES} from '../src/state.ts';
import {GAME_NAMES} from '../src/catalog.ts';
import {newMines} from '../src/minesweeper.ts';
const frame=document.querySelector('#app-frame'),report=document.querySelector('#report'),select=document.querySelector('#game'),games=GAMES.filter(g=>g!=='home');
select.innerHTML=GAMES.map(g=>`<option value="${g}">${GAME_NAMES[g]}</option>`).join('');
const appURL=new URLSearchParams(location.search).has('bundle')?'/dist_single/index.html':'/';
let cursor=0,results=[],running=false,failure=null;
const tick=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const safe=()=>{if(location.port!=='5193')throw Error('Use isolated port 5193.');};
const show=()=>{report.dataset.running=String(running);report.textContent=JSON.stringify({running,failure,checked:results.length,next:cursor<games.length?GAME_NAMES[games[cursor]]:'Complete',results},null,2);};
const page=()=>frame.contentDocument;
const win=()=>frame.contentWindow;
async function ready(game){for(let i=0;i<500;i++){const d=page(),title=d?.querySelector('.status-card h2')?.textContent||'',pending=/^Computer[’']s turn|^(West|East|North) (to play|is bidding)/.test(title)||d?.querySelector('.plus-arena[aria-busy="true"]')||d?.querySelector('[data-plus="hint"]')?.textContent==='Thinking…';if((game==='home'?!!d?.querySelector('.game-cards'):d?.querySelector('main h1')?.textContent===GAME_NAMES[game])&&!d.querySelector('.plus-generating,.board-loading')&&!pending){await tick();return;}await tick();}throw Error('Game did not load: '+game);}
async function open(game){safe();if(!page()?.querySelector('#game-select')){frame.src=appURL;await new Promise(resolve=>frame.onload=resolve);}const s=page().querySelector('#game-select');s.value=game;s.dispatchEvent(new Event('change',{bubbles:true}));await ready(game);select.value=game;await tick();}
function geometry(){const d=page(),w=win(),rect=e=>{const r=e.getBoundingClientRect();return [r.left+w.scrollX,r.top+w.scrollY,r.width,r.height].map(n=>Math.round(n*100)/100);};const boards=[...d.querySelectorAll('#board,.sudoku-board,.card-table,.mine-window,.mine-board,.life-stage,.ski-stage,.tetra-grid,.collection-board,.plus-hex')].filter(e=>e.getBoundingClientRect().width);return {scroll:[w.scrollX,w.scrollY],size:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],boards:boards.map(rect),pan:[...d.querySelectorAll('.mine-scroll,.life-stage,.plus-board-viewport')].map(e=>[e.scrollLeft,e.scrollTop])};}
function mirrorHover(){const d=page();d.querySelector('#hover-mirror')?.remove();const css=[];for(const sheet of d.styleSheets){try{css.push([...sheet.cssRules].map(r=>r.cssText).join('\n').replace(/:hover\b/g,':is(:hover,.qa-hover)'));}catch{}}const style=d.createElement('style');style.id='hover-mirror';style.textContent=css.join('\n');d.head.append(style);return style;}
function hover(el){const d=page(),w=win();d.querySelectorAll('.qa-hover').forEach(e=>e.classList.remove('qa-hover'));for(let e=el;e&&e!==d;e=e.parentElement)e.classList?.add('qa-hover');const r=el.getBoundingClientRect();el.dispatchEvent(new w.PointerEvent('pointerover',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerType:'mouse'}));el.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/2,pointerType:'mouse'}));}
async function check(game){await open(game);const d=page(),style=mirrorHover(),targets=[...d.querySelectorAll('button,select,input,summary,a,canvas,[role="button"],[tabindex],.playing-card,.disc,.game-art')].filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height&&!e.closest('nav'));const issues=[],guidance=new Set();let tested=0;hover(d.body);await tick();for(const el of targets){if(!el.isConnected)continue;el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});hover(d.body);await tick();const before=geometry(),box=el.getBoundingClientRect();hover(el);await tick();const after=geometry();if(game==='mines')guidance.add(d.querySelector('[data-stat="mine-clue"]')?.textContent);const nextBox=el.getBoundingClientRect(),hitShift=el.matches('button,select,input,summary,a,canvas')&&['x','y','width','height'].some(k=>Math.abs(box[k]-nextBox[k])>.5);tested++;if(hitShift||JSON.stringify(before)!==JSON.stringify(after))issues.push({hitShift,target:el.getAttribute('aria-label')||el.dataset.mine||el.textContent.slice(0,50),before,after});}hover(d.body);style.remove();return {game:GAME_NAMES[game],width:win().innerWidth,targets:tested,issues,...(game==='mines'?{guidance:[...guidance]}:{})};}
async function run(fn){if(running)return;running=true;failure=null;const controls=[...document.querySelectorAll('button,input,select')];controls.forEach(e=>e.disabled=true);try{safe();report.textContent='Checking…';report.dataset.running='true';await fn();show();}catch(e){failure=e.stack;}finally{running=false;controls.forEach(e=>e.disabled=false);show();}}
document.querySelector('#reset').onclick=()=>run(async()=>{const s=freshState();s.preferences.game='mines';s.mines=newMines();s.mines.mines=[0,4,8,14,27,44,53,69,72,80];s.mines.open[10]=s.mines.open[20]=true;s.mines.flags[0]=true;s.mines.status='playing';s.draughts.options.mode=s.preferences.draughts.mode='local';s.draughts.board.fill(0);s.draughts.board[42]=1;s.draughts.board[35]=s.draughts.board[21]=-1;s.draughts.board[5]=-2;frame.src='about:blank';await new Promise(resolve=>frame.onload=resolve);saveState(s);frame.src=appURL;await new Promise(resolve=>frame.onload=resolve);await ready('mines');select.value='mines';cursor=0;results=[];});
document.querySelector('#resize').onclick=()=>{frame.style.width=document.querySelector('#width').value+'px';};
document.querySelector('#open').onclick=()=>run(()=>{cursor=Math.max(0,games.indexOf(select.value));return open(select.value);});
document.querySelector('#single').onclick=()=>run(async()=>results.push(await check(select.value)));
document.querySelector('#batch').onclick=()=>run(async()=>{const end=Math.min(games.length,cursor+8);while(cursor<end){results.push(await check(games[cursor++]));show();}});
document.querySelector('#all').onclick=()=>run(async()=>{cursor=0;while(cursor<games.length){results.push(await check(games[cursor++]));show();}});
document.querySelector('#followup').onclick=()=>run(async()=>{for(const game of ['sudoku','tafl','spades','whist','tangrams','home']){results.push(await check(game));show();}});
document.querySelector('#clear').onclick=()=>{results=[];cursor=0;show();};
document.querySelector('#draughts').onclick=()=>run(async()=>{await open('draughts');const phases=[];const snap=label=>phases.push({label,scroll:[win().scrollX,win().scrollY],board:geometry().boards,top:page().querySelector('.draughts-board').getBoundingClientRect().top+win().scrollY});snap('before selection');page().querySelector('[data-square="42"]').click();await tick();snap('capture selected');page().querySelector('[data-square="28"]').click();for(let i=0;i<60;i++)await tick();snap('first jump');page().querySelector('[data-square="14"]').click();for(let i=0;i<60;i++)await tick();snap('capture complete');results.push({game:'Draughts capture stability',phases,issues:phases.filter(p=>Math.abs(p.top-phases[0].top)>.5||JSON.stringify(p.scroll)!==JSON.stringify(phases[0].scroll))});});
frame.style.width='1240px';
</script></html>
