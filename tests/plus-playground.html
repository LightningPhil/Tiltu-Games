<!doctype html><html lang="en"><meta charset="utf-8"><title>Grid Club second collection practice</title><style>body{font:16px system-ui;background:#101a27;color:#eef7fa;max-width:760px;margin:40px auto;padding:20px}select,button{font:inherit;padding:12px;margin:8px;max-width:100%}a{color:#72edee}</style>
<h1>Second collection practice positions</h1><p>This development loader replaces practice data only on isolated port 5193. The offline file’s saved games stay separate.</p><label>Position<select id="fixture"></select></label><button id="load">Load isolated practice</button><p id="status"></p><a href="/">Play practice position →</a>
<script type="module">
import {freshState,saveState} from '../src/state.ts';
import {PLUS_GAMES,PLUS_NAMES} from '../src/club-plus/meta.ts';
import {newPlus} from '../src/club-plus/store.ts';

import {DOMINO_TILES} from '../src/club-plus/dominoes.ts';
import {findWord} from '../src/club-plus/playful.ts';
const select=document.querySelector('#fixture');select.innerHTML=PLUS_GAMES.map(k=>`<option value="${k}">${PLUS_NAMES[k]} · finish / key rule</option>`).join('')+'<option value="dominoes:fives">Dominoes · Muggins scoring</option><option value="dominoes:block">Dominoes · Block finish</option><option value="gin:gin">Gin · declare Gin</option><option value="nim:misere">Nim · misère finish</option>';
document.querySelector('#load').onclick=()=>{if(location.port!=='5193'){document.querySelector('#status').textContent='Use isolated port 5193.';return;}const [key,variant]=select.value.split(':'),state=freshState(),s=newPlus(key,variant?{variant}: {},42);state.preferences.game=key;state.preferences.motion='relaxed';state.plus[key]=s;if(['snakes','senet','ludo','ur','chinese','halma','fox','tafl','gomoku','nim','hex','dominoes'].includes(key))s.mode='local';
 if(key==='snakes'){s.pawns=[[99],[90]];s.phase='move';s.roll=1;s.dice=[1];}
 if(key==='senet'){s.pawns=[[30,30,30,30,29],[19,20,21,22,23]];s.phase='move';s.roll=1;s.dice=[1,0,0,0];}
 if(key==='ur'){s.pawns=[[14,14,14,14,14,14,13],[-1,-1,-1,-1,-1,-1,-1]];s.phase='move';s.roll=1;s.dice=[1,0,0,0];}
 if(key==='ludo'){s.pawns=[[56,56,56,55],[-1,-1,-1,-1]];s.phase='move';s.roll=1;s.dice=[1];}
 if(key==='gomoku'){[0,1,2,3].forEach(i=>s.board[i]=1);[15,16,17].forEach(i=>s.board[i]=2);}
 if(key==='hex'){for(let r=0;r<s.size-1;r++)s.board[r*s.size+2]=1;}
 if(key==='nim')s.heaps=[1];
 if(key==='chinese'||key==='halma'){s.board.fill(0);const target=hopGoal(s,0),other=hopGoal(s,1);target.forEach(i=>s.board[i]=1);other.forEach(i=>s.board[i]=2);let hole,from;if(key==='chinese'){hole=target.find(i=>STAR_POINTS[i][1]===5);const [x,y]=STAR_POINTS[hole];from=STAR_POINTS.findIndex(p=>p[0]===x&&p[1]===y-1);}else{hole=target.find(i=>!target.includes(i-s.size));from=hole-s.size;}s.board[hole]=0;s.board[from]=1;s.notice=`Move point ${from+1} into point ${hole+1}.`;}
 if(key==='fox'){s.board.fill(0);const at=(x,y)=>FOX_POINTS.findIndex(p=>p[0]===x&&p[1]===y);s.board[at(3,3)]=2;s.board[at(3,2)]=s.board[at(2,4)]=s.board[at(4,4)]=1;s.turn=1;}
 if(key==='tafl'){s.board.fill(0);s.board[7]=3;s.board[47]=2;s.turn=0;}
 if(key==='dominoes'){const id=(a,b)=>DOMINO_TILES.findIndex(t=>t[0]===a&&t[1]===b),lead=variant==='fives'?id(3,4):id(2,3),hand=variant==='fives'?id(1,3):id(1,2),rival=id(6,6);s.chain=[{tile:lead,left:DOMINO_TILES[lead][0],right:DOMINO_TILES[lead][1]}];s.hands=[[hand],[rival]];s.stock=DOMINO_TILES.map((_,i)=>i).filter(i=>![lead,hand,rival].includes(i));s.opening=null;s.turn=0;s.scores=[variant==='fives'?49:99,0];s.target=variant==='fives'?50:100;}
 if(key==='hearts'){s.phase='moon';s.hands=[[],[],[],[]];s.seen=Array.from({length:52},(_,card)=>({card,player:card%4}));s.logs=Array.from({length:13},(_,i)=>({plays:s.seen.slice(i*4,i*4+4),winner:0}));s.trick=[];s.lastTrick=s.logs.at(-1).plays;s.handPoints=[26,0,0,0];s.taken=[13,0,0,0];s.moon=0;s.scores=[10,80,80,80];s.turn=0;}
 if(key==='spades'||key==='whist'){s.hands=[[0],[13],[26],[39]];const kept=s.hands.flat(),rest=Array.from({length:52},(_,i)=>i).filter(c=>!kept.includes(c));s.seen=rest.map((card,i)=>({card,player:i%4}));s.logs=Array.from({length:12},(_,i)=>({plays:s.seen.slice(i*4,i*4+4),winner:i%3}));s.trick=[];s.lastTrick=s.logs.at(-1).plays;s.phase='play';s.turn=0;s.trump=0;s.broken=true;s.bids=[6,2,4,1];s.taken=[6,2,4,0];s.scores=[key==='spades'?490:4,0];}
 if(key==='gin'){const own=variant==='gin'?[26,27,28,8,21,34,47,16,17,18,12]:[6,19,32,29,30,31,20,21,22,2,12],defence=variant==='gin'?Array.from({length:52},(_,i)=>i).filter(c=>!own.includes(c)).slice(0,10):[45,26,27,28,23,24,25,0,13,39],rest=Array.from({length:52},(_,i)=>i).filter(c=>!own.includes(c)&&!defence.includes(c));s.hands=[own,defence];s.discard=[rest.pop()];s.stock=rest;s.phase='discard';s.turn=0;s.drawn=12;s.drawSource='stock';s.knownTakes=[[],[]];s.seenDiscard=s.discard.slice();}
 if(key==='memory'){const face=s.deck[0];s.matched=s.deck.map(n=>n===face?0:1);s.known=s.deck.map((n,i)=>s.matched[i]?n:-1);s.scores=[s.pairs-1,0];}
 if(['kakuro','futoshiki','skyscrapers'].includes(key)){s.values=s.solution.slice();const empty=s.white.findIndex((n,i)=>n&&!s.givens[i]);s.values[empty]=0;s.selected=empty;}
 if(key==='slitherlink'){s.edges=s.solution.slice();const empty=s.solution.findIndex((n,i)=>n===1&&!s.givens[i]);s.edges[empty]=0;}
 if(key==='hashi'){s.values=s.solution.slice();const empty=s.solution.findIndex((n,i)=>n>0&&!s.givens[i]);s.values[empty]=0;}
 if(key==='wordsearch')for(const p of s.placements.slice(0,-1))findWord(s,p.path[0],p.path.at(-1));
 if(key==='tangrams'){s.pieces=structuredClone(s.solution);s.pieces[0].x+=1;s.magnet=false;}
 document.querySelector('#status').textContent=saveState(state)?'Practice position ready.':'Practice storage unavailable.';
};
