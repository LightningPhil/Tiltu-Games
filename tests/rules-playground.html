<!doctype html><html lang="en"><meta charset="utf-8"><title>Grid Club rules playthrough</title>
<style>body{font:15px system-ui;margin:20px;background:#101a27;color:#eef7fa}button{font:inherit;padding:10px;margin:5px}pre{white-space:pre-wrap;max-height:200px;overflow:auto}#summary{font-size:20px;color:#8befbb}iframe{display:block;width:1240px;max-width:100%;height:800px;border:1px solid #567}#loader{display:none}</style>
<h1>Rules playthrough · all 48 games</h1><p>Development checks on isolated port 5193. Uses ordinary game controls and disposable practice positions. Optional ?bundle checks the built offline app.</p>
<button id="run">Play all games and variants</button><button id="retry">Retry failures</button><p id="summary">Ready</p><pre id="report" role="status">Ready.</pre><iframe id="game" title="Grid Club under test"></iframe><iframe id="loader" title="Practice position loader"></iframe>
<script type="module">
import {freshState,saveState,STORAGE_KEY} from '../src/state.ts';
import {applyMove,other,moveLabel} from '../src/rules.ts';
import {updateResult} from '../src/state.ts';
import {hopMoves} from '../src/club-plus/hop.ts';
import {newPlus} from '../src/club-plus/store.ts';
import {newMines} from '../src/minesweeper.ts';
import {newLife,lifeNext} from '../src/life.ts';
import {newPatience} from '../src/patience.ts';
const frame=document.querySelector('#game'),loader=document.querySelector('#loader'),report=document.querySelector('#report');
const appURL=new URLSearchParams(location.search).has('bundle')?'/dist_single/index.html':'/';
const pause=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument;
const check=(v,m)=>{if(!v)throw Error(m);};
const read=()=>JSON.parse(localStorage.getItem(STORAGE_KEY));
const load=async(f,url)=>{await new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=reject;f.src=url;});};
async function click(selector){const el=doc().querySelector(selector);check(el,'Missing control '+selector);check(!el.disabled,'Disabled control '+selector);el.click();await pause(80);}
async function settle(ms=1350){await pause(ms);for(let i=0;i<100&&doc().querySelector('[aria-busy="true"]');i++)await pause(80);frame.contentWindow.dispatchEvent(new Event('pagehide'));await pause(30);}
async function fixture(group,id){await load(frame,'about:blank');await load(loader,`/tests/${group}-playground.html`);const d=loader.contentDocument;d.querySelector('#fixture').value=id;d.querySelector('#load').click();check(/ready/i.test(d.querySelector('#status').textContent),'Fixture failed '+id);const s=read();await load(frame,appURL);await pause(400);return s;}
async function custom(make){await load(frame,'about:blank');const s=freshState();s.preferences.motion='quick';make(s);saveState(s);await load(frame,appURL);await pause(400);return s;}
const plusClick=x=>click(`[data-plus="${x}"]`),colClick=x=>click(`[data-collection="${x}"]`);
const cases=[];function add(name,run){cases.push({name,run});}
add('Four in a Row',async()=>{await custom(s=>{s.preferences.game='four';s.four.options.mode=s.preferences.four.mode='local';const f=s.four;for(const c of [0,6,1,6,2,5]){f.history.push({board:f.board.slice(),turn:f.turn,quiet:f.quiet});f.moves.push({player:f.turn,text:moveLabel('four',c)});f.board=applyMove('four',f.board,f.turn,c);f.turn=other(f.turn);updateResult('four',f);}});await click('[data-column="3"]');if(doc().querySelector('[data-quick="drop"]'))await click('[data-quick="drop"]');await settle();check(read().four.result===1,'Winning line not completed');});
add('Draughts',async()=>{await fixture('ux','draughts');await click('[data-square="42"]');await click('[data-square="40"]');await settle(100);check(read().draughts.board[42]===1,'Illegal quiet move accepted during mandatory capture');await click('[data-square="42"]');if(!doc().querySelector('[data-square="28"].target-square'))await click('[data-square="42"]');await click('[data-square="28"]');await settle(100);if(doc().querySelector('[data-square="14"].target-square'))await click('[data-square="14"]');await settle();check(read().draughts.board[14]===1&&read().draughts.board[35]===0&&read().draughts.board[21]===0,'Full capture route failed');});
add('Chess',async()=>{await fixture('ux','chess-castle');await click('[data-chess-square="60"]');await click('[data-chess-square="62"]');await settle();check(read().chess.moves.includes('O-O'),'Castling failed');});
add('Chess · promotion',async()=>{await fixture('ux','chess-promotion');await click('[data-chess-square="8"]');await click('[data-chess-square="0"]');await pause(100);check(doc().querySelectorAll('[data-promote]').length===4,'Promotion choices incomplete');await click('[data-promote="n"]');await settle();check(read().chess.moves.some(m=>m.includes('=N')),'Underpromotion failed');});
add('Go',async()=>{await fixture('ux','go');await click('[data-point="49"]');if(doc().querySelector('[data-quick="go-place"]'))await click('[data-quick="go-place"]');await settle();check(read().go.board[40]===0&&read().go.board[49]===1,'Atari capture failed');});
add('Sudoku',async()=>{const s=await fixture('ux','sudoku'),at=s.sudoku.puzzle.findIndex(n=>!n),fixed=s.sudoku.puzzle.findIndex(Boolean);await click(`[data-cell="${fixed}"]`);await click('[data-number="1"]');await settle(50);check(read().sudoku.values[fixed]===s.sudoku.puzzle[fixed],'Fixed clue changed');await click(`[data-cell="${at}"]`);await click(`[data-number="${s.sudoku.solution[at]}"]`);await settle(50);check(read().sudoku.values[at]===s.sudoku.solution[at],'Editable digit rejected');});
add('Blackjack',async()=>{await fixture('ux','blackjack');await click('[data-bj="split"]');await settle();check(read().blackjack.hands.length===2,'Legal split failed');check(doc().querySelector('[data-bj="split"]').disabled,'Non-pair split offered');await click('[data-bj="stand"]');await settle();check(read().blackjack.active===1||read().blackjack.phase==='settled','Split turn failed');});
add('Patience · Klondike',async()=>{await fixture('ux','patience');await click('[data-card-source="tableau:0:0"]');await click('[data-patience="move:foundation:0"]');await settle();check(read().patience.foundations[0].length===13,'King foundation move failed');});
add('Patience · FreeCell',async()=>{await fixture('collection','freecell-win');await colClick('card:column:0:0');await colClick('destination:foundation:0:0');await settle();check(read().collection.freecell.foundations[0].length===13,'FreeCell foundation failed');});
add('Patience · Spider',async()=>{await fixture('collection','spider-win');check(doc().querySelector('[data-collection="spider-deal"]').disabled,'Empty-stock deal enabled');await colClick('card:column:1:0');await colClick('destination:column:0:0');await settle();check(read().collection.spider.completed.length===8,'Eighth suited run not collected');});
add('Minesweeper',async()=>{await custom(s=>{s.preferences.game='mines';s.mines=newMines();});await click('[data-mine="40"]');await settle(100);let m=read().mines;check(m.open[40]&&!m.mines.some(i=>Math.abs(i%9-4)<=1&&Math.abs(Math.floor(i/9)-4)<=1),'First click neighbourhood unsafe');const at=m.open.findIndex(n=>!n);await click('[data-arcade="flag-mode"]');await click(`[data-mine="${at}"]`);await click('[data-arcade="flag-mode"]');await click(`[data-mine="${at}"]`);await settle(100);m=read().mines;check(m.flags[at]&&!m.open[at],'Flagged square opened');});
add('Conway’s Game of Life',async()=>{const s=await custom(s=>{s.preferences.game='life';s.life=newLife();});const expected=lifeNext(s.life.cells,s.life.width,s.life.height,s.life.wrap);await click('[data-arcade="step"]');await settle(100);check(JSON.stringify(read().life.cells)===JSON.stringify(expected),'B3/S23 generation differs');await click('[data-arcade="run"]');await pause(1500);await click('[data-arcade="run"]');await settle(100);check(read().life.generation>2,'Simulation stopped');});
add('Downhill Skiing',async()=>{await custom(s=>s.preferences.game='ski');await click('[data-arcade="run"]');await pause(3500);await click('[data-arcade="run"]');await settle(100);check(read().ski.y>0,'Skier did not advance');});
add('TetraVex',async()=>{await fixture('ux','tetravex');await click('[data-arcade="tile:tray:0"]');await click('[data-arcade="tile:board:0"]');await settle(200);check(read().tetravex.board[0]===0,'First placement failed');});
for(const variant of ['holdem','omaha','draw'])add('Poker · '+variant,async()=>{await fixture('ux',variant==='holdem'?'poker':'poker-'+variant);const legal=doc().querySelector('[data-poker="check"]:not(:disabled),[data-poker="call"]:not(:disabled),[data-poker="exchange"]:not(:disabled)');check(legal,'No playable poker action');legal.click();await settle(1500);check(['showdown','betting','draw'].includes(read().poker.phase),'Poker action did not progress');});
for(const key of ['noughts','reversi','morris','dots','kalah'])add(({noughts:'Noughts and Crosses',reversi:'Reversi',morris:'Nine Men’s Morris',dots:'Dots and Boxes',kalah:'Kalah'})[key],async()=>{await fixture('collection',key);const to={noughts:2,reversi:19,morris:2,dots:null,kalah:0}[key];if(key==='reversi'){check(doc().querySelector('[data-collection="turn:0"]').disabled,'Unsupported Reversi placement enabled');}await colClick('turn:'+(to??[...doc().querySelectorAll('[data-collection^="turn:"]')].find(e=>!e.disabled).dataset.collection.split(':')[1]));await settle();const s=read().collection[key];check(key==='noughts'?s.result===1:key==='reversi'?s.board[27]===1:key==='morris'?s.phase==='take':key==='dots'?s.board.slice(2*s.size*(s.size+1),2*s.size*(s.size+1)+2).every(n=>n===1):s.board[6]===26,'Rule outcome failed for '+key);});
add('Backgammon',async()=>{await fixture('collection','backgammon-off');await colClick('bg-point:0');const b=doc().querySelector('[data-collection^="bg-move:0:-1:"]');check(b,'Bear-off control missing');b.click();await settle();check(read().collection.backgammon.result===1,'Bearing off final checker failed');});
add('Mahjong Solitaire',async()=>{await fixture('collection','mahjong');await colClick('mahjong:0');await colClick('mahjong:1');await settle();check(read().collection.mahjong.tiles.every(t=>t.removed),'Matching flowers did not clear');});
add('15 Puzzle',async()=>{await fixture('collection','sliding');check(doc().querySelector('[data-collection="slide:0"]').disabled,'Nonadjacent tile enabled');await colClick('slide:15');await settle();check(read().collection.sliding.completed,'Final adjacent tile failed');});
add('Peg Solitaire',async()=>{await fixture('collection','pegs');await colClick('peg:14');await colClick('peg:16');await settle();check(read().collection.pegs.board.filter(Boolean).length===1,'Final jump failed');});
add('Nonograms',async()=>{await fixture('collection','nonograms');await colClick('nono:1');await settle(100);check(read().collection.nonograms.cells.every((n,i)=>(n===1)===!!read().collection.nonograms.solution[i]),'Picture did not finish');});
add('Cribbage',async()=>{await fixture('collection','cribbage');await colClick('crib-count');await settle();check(read().collection.cribbage.scores[0]===29,'29-point hand scored incorrectly');});
add('Snake',async()=>{await fixture('collection','snake');await colClick('snake-run');await pause(250);await colClick('pause');await settle(50);check(read().collection.snake.score>=1,'Apple not eaten');});
for(const key of ['snakes','senet','ludo','ur'])add(({snakes:'Snakes and Ladders',senet:'Senet',ludo:'Ludo',ur:'Royal Game of Ur'})[key],async()=>{await fixture('plus',key);await click('[data-plus="race-move:'+(key==='ludo'?3:key==='senet'?4:key==='ur'?6:0)+'"]:not(:disabled)');await settle(1600);check(read().plus[key].result===0,'Exact final move did not win');});
for(const key of ['chinese','halma','fox','tafl'])add(({chinese:'Chinese Chequers',halma:'Halma',fox:'Fox and Geese',tafl:'Hnefatafl'})[key],async()=>{const s=(await fixture('plus',key)).plus[key],m=hopMoves(s).find(m=>key==='tafl'?m.from===7&&m.to===0:key==='fox'?m.captured!==undefined:s.notice.includes('point '+(m.from+1)+' into point '+(m.to+1)));check(m,'Expected final route missing');await plusClick('hop:'+m.from);await plusClick('hop:'+m.to);await settle(1600);check(read().plus[key].result!==null,'Final route did not finish');});
add('Gomoku',async()=>{await fixture('plus','gomoku');check(doc().querySelector('[data-plus="abstract:0"]').disabled,'Occupied intersection enabled');await plusClick('abstract:4');await settle(100);check(read().plus.gomoku.result===0,'Five stones did not win');});
add('Hex',async()=>{const s=(await fixture('plus','hex')).plus.hex;await plusClick('abstract:'+((s.size-1)*s.size+2));await settle(100);check(read().plus.hex.result===0,'Connected edges did not win');});
add('Hex · pie swap',async()=>{await custom(s=>{s.preferences.game='hex';s.plus.hex=newPlus('hex',{mode:'local'},42);});await plusClick('abstract:24');await plusClick('abstract:-1');await settle(100);check(read().plus.hex.colours[0]===2,'Pie swap failed');});
for(const variant of ['normal','misere','subtract'])add('Nim · '+variant,async()=>{await custom(s=>{s.preferences.game='nim';s.plus.nim=newPlus('nim',{mode:'local',variant},42);s.plus.nim.heaps=[1];});await plusClick('abstract:1');await settle(100);check(read().plus.nim.result===(variant==='misere'?1:0),'Last-object rule incorrect');});
for(const variant of ['draw','block','fives'])add('Dominoes · '+variant,async()=>{await fixture('plus','dominoes'+(variant==='draw'?'':':'+variant));await click('[data-plus^="domino-select:"]:not(:disabled)');await click('[data-plus^="domino-play:"]:not(:disabled)');await settle(1000);check(read().plus.dominoes.roundOver||read().plus.dominoes.result!==null,'Last matching domino did not finish hand');});
add('Hearts',async()=>{await fixture('plus','hearts');await plusClick('moon:add');await settle(100);check(read().plus.hearts.scores[1]===106,'Moon score incorrect');});
for(const key of ['spades','whist'])add(key==='spades'?'Spades':'Whist',async()=>{await fixture('plus',key);if(key==='whist')check(/Turned card:/.test(doc().querySelector('.whist-upcard').textContent),'Turned trump card missing');await plusClick('trick-card:0');await settle(3500);check(read().plus[key].hands[0].length===0,'Legal final trick card not played');});
add('Gin Rummy',async()=>{await fixture('plus','gin:gin');await plusClick('gin-select:12');await plusClick('gin-knock');await settle(1000);check(read().plus.gin.phase==='summary'&&read().plus.gin.scores[0]>=20,'Gin declaration not scored');});
add('Memory Pairs',async()=>{const s=(await fixture('plus','memory')).plus.memory,indices=s.matched.flatMap((v,i)=>v?[]:[i]);await plusClick('memory:'+indices[0]);await plusClick('memory:'+indices[1]);await settle(1600);check(read().plus.memory.result===0,'Last matching pair failed');});
for(const key of ['kakuro','futoshiki','skyscrapers'])add(key[0].toUpperCase()+key.slice(1),async()=>{const s=(await fixture('plus',key)).plus[key],at=s.selected;await plusClick('number-cell:'+at);await plusClick('number:'+s.solution[at]);await settle(100);check(read().plus[key].result===0,'Valid number solution not completed');});
add('Slitherlink',async()=>{const s=(await fixture('plus','slitherlink')).plus.slitherlink,at=s.solution.findIndex((v,i)=>v===1&&!s.givens[i]);await plusClick('loop:'+at);await settle(100);check(read().plus.slitherlink.result===0,'Single loop not completed');});
add('Hashi',async()=>{const s=(await fixture('plus','hashi')).plus.hashi,at=s.solution.findIndex((v,i)=>v>0&&!s.givens[i]);for(let i=0;i<s.solution[at];i++)await plusClick('bridge:'+at);await settle(100);check(read().plus.hashi.result===0,'Connected bridge network not completed');});
add('Tangrams',async()=>{await fixture('plus','tangrams');await plusClick('tan-select:0');for(let i=0;i<4;i++)await plusClick('tan-nudge:-.25:0');await settle(100);check(read().plus.tangrams.result===0,'Valid silhouette not accepted');});
add('Word Search',async()=>{const s=(await fixture('plus','wordsearch')).plus.wordsearch,p=s.placements.at(-1);await plusClick('word:'+p.path.at(-1));await plusClick('word:'+p.path[0]);await settle(100);check(read().plus.wordsearch.result===0,'Reverse word path not accepted');});
add('Klondike · relocate a whole King column',async()=>{await custom(s=>{s.preferences.game='patience';s.patience=newPatience();Object.assign(s.patience,{tableau:Array.from({length:7},(_,i)=>i===0?[{card:25,up:true}]:[]),stock:Array.from({length:52},(_,i)=>i).filter(i=>i!==25),waste:[],foundations:[[],[],[],[]]});});await click('[data-card-source="tableau:0:0"]');await click('[data-patience="move:tableau:1"]');await settle();check(read().patience.tableau[1][0].card===25,'Legal King relocation missing from controls');});
add('Hnefatafl · king captured against corner',async()=>{await custom(s=>{s.preferences.game='tafl';s.plus.tafl=newPlus('tafl',{mode:'local'},42);const t=s.plus.tafl;t.board.fill(0);t.board[1]=3;t.board[9]=2;t.board[24]=1;t.turn=1;});await plusClick('hop:9');await plusClick('hop:2');await settle(1300);check(read().plus.tafl.result===1&&!read().plus.tafl.board.includes(3),'Hostile corner capture missed');});
add('Gomoku · final point and Expert advice',async()=>{await custom(s=>{s.preferences.game='gomoku';s.plus.gomoku=newPlus('gomoku',{mode:'local'},42);const g=s.plus.gomoku;g.board=g.board.map((_,i)=>1+((Math.floor(i/15)+2*(i%15))%4<2?0:1));g.board[0]=0;});await plusClick('hint');await settle(1500);check(doc().querySelector('[data-plus="abstract:0"].is-hinted'),'Expert could not advise on last point');await plusClick('abstract:0');await settle(100);check(read().plus.gomoku.result===-1,'Final point did not draw');});
add('Chess · dead locked pawn wall',async()=>{await custom(s=>{s.preferences.game='chess';s.chess.options.mode=s.preferences.chess.mode='local';s.chess.startFen='7k/8/8/p1p1p1p1/P1P1P1P1/8/8/K7 w - - 0 1';});check(/Dead position/.test(doc().querySelector('.status-card').textContent),'Dead pawn position not drawn');check([...doc().querySelectorAll('[data-chess-square]')].every(b=>b.disabled),'Moves available after dead-position draw');});
let results=[],running=false;
function show(){document.querySelector('#summary').textContent=`${results.filter(r=>r.pass).length} / ${cases.length} passed · ${results.filter(r=>!r.pass).length} failures${running?' · playing…':''}`;report.dataset.running=String(running);report.textContent=JSON.stringify({running,scenarios:cases.length,passed:results.filter(r=>r.pass).length,failed:results.filter(r=>!r.pass).length,results},null,2);}
async function run(retry){if(running)return;check(location.port==='5193','Use isolated port 5193.');const queue=retry?cases.filter(c=>results.some(r=>r.name===c.name&&!r.pass)):cases;if(!retry)results=[];running=true;show();for(const c of queue){report.textContent+='\nPlaying '+c.name;let error;try{await c.run();}catch(e){error=e.message;}results=results.filter(r=>r.name!==c.name);results.push({name:c.name,pass:!error,...(error?{error}:{}),status:doc()?.querySelector('.status-card h2')?.textContent});show();}running=false;show();}
document.querySelector('#run').onclick=()=>run(false);document.querySelector('#retry').onclick=()=>run(true);
</script></html>
